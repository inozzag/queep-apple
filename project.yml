name: Queep
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
options:
  bundleIdPrefix: app.queep
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Queep
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  QueepCore:
    path: Packages/QueepCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.19.1
targets:
  QueepMac:
    type: application
    platform: macOS
    sources: [Sources/Shared, Sources/Mac]
    dependencies:
      - package: QueepCore
      - package: Firebase
        product: FirebaseAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.queep.mac
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Config/Mac.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.queep.mac.dev
  QueepiOS:
    type: application
    platform: iOS
    sources: [Sources/Shared, Sources/iOS]
    dependencies:
      - package: QueepCore
      - package: Firebase
        product: FirebaseAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.queep.ios
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.queep.ios.dev
  QueepiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests]
    dependencies:
      - target: QueepiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.queep.ios.uitests
        TEST_TARGET_NAME: QueepiOS
schemes:
  QueepMac:
    build:
      targets:
        QueepMac: all
  QueepiOS:
    build:
      targets:
        QueepiOS: all
    test:
      targets: [QueepiOSUITests]
