name: Queep
configs:
  Debug: debug
  CloudDevelopment: debug
  Release: release
  TestFlight: release
configFiles:
  Debug: Config/Debug.xcconfig
  CloudDevelopment: Config/CloudDevelopment.xcconfig
  Release: Config/Release.xcconfig
  TestFlight: Config/TestFlight.xcconfig
options:
  bundleIdPrefix: app.queep
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '13'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Queep
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    QUEEP_URL_SCHEME: queep
    QUEEP_AUTH_GROUP: app.queep.auth
  configs:
    Debug:
      QUEEP_URL_SCHEME: queep-local
      QUEEP_AUTH_GROUP: app.queep.auth.local
    TestFlight:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) QUEEP_CLOUD"
      QUEEP_URL_SCHEME: queep-dev
      QUEEP_AUTH_GROUP: app.queep.auth.dev
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    CloudDevelopment:
      QUEEP_URL_SCHEME: queep-dev
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG QUEEP_CLOUD"
      QUEEP_AUTH_GROUP: app.queep.auth.dev
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.89.0
  QueepCore:
    path: Packages/QueepCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.19.1
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 8.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    exactVersion: 3.81.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    exactVersion: 9.26.1
targets:
  QueepMac:
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
    type: application
    platform: macOS
    info:
      path: Config/Generated/Mac-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        QueepRevenueCatKey: $(QUEEP_REVENUECAT_PUBLIC_KEY)
        QueepPrivacyURL: $(QUEEP_PRIVACY_URL)
        QueepTermsURL: $(QUEEP_TERMS_URL)
        QueepURLScheme: $(QUEEP_URL_SCHEME)
        QueepAPIURL: $(QUEEP_API_URL)
        QueepFirebaseProjectID: $(QUEEP_FIREBASE_PROJECT_ID)
        GIDClientID: $(QUEEP_GOOGLE_CLIENT_ID)
        NSSpeechRecognitionUsageDescription: O Queep transcreve no próprio aparelho a fala dos áudios e vídeos que você salva, para encontrá-los na busca.
        QueepPostHogKey: $(QUEEP_POSTHOG_KEY)
        QueepPostHogHost: $(QUEEP_POSTHOG_HOST)
        QueepSentryDSN: $(QUEEP_SENTRY_DSN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(QUEEP_GOOGLE_REVERSED_CLIENT_ID)
              - $(QUEEP_URL_SCHEME)
    sources: [Sources/Shared, Sources/Mac]
    postBuildScripts:
      - path: Scripts/verify-billing-config.sh
        name: Verify release billing configuration
        basedOnDependencyAnalysis: false
      - path: Scripts/copy-firebase-config.sh
        name: Select Firebase environment
        basedOnDependencyAnalysis: false
        inputFiles: ["$(SRCROOT)/$(QUEEP_FIREBASE_CONFIG)"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist"]
      - path: Scripts/upload-sentry-dsym.sh
        name: Upload Sentry dSYM
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: QueepCore
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: PostHog
        product: PostHog
      - package: Sentry
        product: Sentry
    settings:
      base:
        QUEEP_REVENUECAT_PUBLIC_KEY: $(QUEEP_REVENUECAT_MAC_KEY)
        PRODUCT_BUNDLE_IDENTIFIER: app.queep.mac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Config/Mac.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.queep.mac.local
        CloudDevelopment:
          PRODUCT_BUNDLE_IDENTIFIER: app.queep.mac.dev
          QUEEP_FIREBASE_CONFIG: Config/Firebase/Development/Mac/GoogleService-Info.plist
        TestFlight:
          PRODUCT_BUNDLE_IDENTIFIER: app.queep.mac.dev
          QUEEP_FIREBASE_CONFIG: Config/Firebase/Development/Mac/GoogleService-Info.plist
  QueepiOS:
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
    type: application
    platform: iOS
    info:
      path: Config/Generated/iOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        QueepRevenueCatKey: $(QUEEP_REVENUECAT_PUBLIC_KEY)
        QueepPrivacyURL: $(QUEEP_PRIVACY_URL)
        QueepTermsURL: $(QUEEP_TERMS_URL)
        QueepURLScheme: $(QUEEP_URL_SCHEME)
        QueepAPIURL: $(QUEEP_API_URL)
        QueepFirebaseProjectID: $(QUEEP_FIREBASE_PROJECT_ID)
        GIDClientID: $(QUEEP_GOOGLE_CLIENT_ID)
        NSSpeechRecognitionUsageDescription: O Queep transcreve no próprio aparelho a fala dos áudios e vídeos que você salva, para encontrá-los na busca.
        QueepPostHogKey: $(QUEEP_POSTHOG_KEY)
        QueepPostHogHost: $(QUEEP_POSTHOG_HOST)
        QueepSentryDSN: $(QUEEP_SENTRY_DSN)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(QUEEP_GOOGLE_REVERSED_CLIENT_ID)
              - $(QUEEP_URL_SCHEME)
        QueepAuthGroup: $(AppIdentifierPrefix)$(QUEEP_AUTH_GROUP)
    sources: [Sources/Shared, Sources/iOS]
    postBuildScripts:
      - path: Scripts/verify-billing-config.sh
        name: Verify release billing configuration
        basedOnDependencyAnalysis: false
      - path: Scripts/copy-firebase-config.sh
        name: Select Firebase environment
        basedOnDependencyAnalysis: false
        inputFiles: ["$(SRCROOT)/$(QUEEP_FIREBASE_CONFIG)"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist"]
      - path: Scripts/upload-sentry-dsym.sh
        name: Upload Sentry dSYM
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: QueepShare
        embed: true
      - package: QueepCore
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: PostHog
        product: PostHog
      - package: Sentry
        product: Sentry
    settings:
      base:
        QUEEP_REVENUECAT_PUBLIC_KEY: $(QUEEP_REVENUECAT_IOS_KEY)
        PRODUCT_BUNDLE_IDENTIFIER: app.queep.ios
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.queep.ios.local
        CloudDevelopment:
          PRODUCT_BUNDLE_IDENTIFIER: app.queep.ios.dev
          QUEEP_FIREBASE_CONFIG: Config/Firebase/Development/iOS/GoogleService-Info.plist
        TestFlight:
          PRODUCT_BUNDLE_IDENTIFIER: app.queep.ios.dev
          QUEEP_FIREBASE_CONFIG: Config/Firebase/Development/iOS/GoogleService-Info.plist
  QueepShare:
    type: app-extension
    platform: iOS
    info:
      path: Config/Generated/Share-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Salvar no Queep
        QueepURLScheme: $(QUEEP_URL_SCHEME)
        QueepAPIURL: $(QUEEP_API_URL)
        QueepFirebaseProjectID: $(QUEEP_FIREBASE_PROJECT_ID)
        QueepSentryDSN: $(QUEEP_SENTRY_DSN)
        QueepAuthGroup: $(AppIdentifierPrefix)$(QUEEP_AUTH_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationDictionaryVersion: 2
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 10
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    sources:
      - Sources/Share
      - Sources/Shared/Session.swift
      - Sources/Shared/ImportedImage.swift
      - Sources/Shared/ImportedMedia.swift
      - Sources/Shared/IncomingReference.swift
      - Sources/Shared/ShareCaptureQueue.swift
      - Sources/Shared/CrashReporting.swift
    postBuildScripts:
      - path: Scripts/copy-firebase-config.sh
        name: Select Firebase environment
        basedOnDependencyAnalysis: false
        inputFiles: ["$(SRCROOT)/$(QUEEP_FIREBASE_CONFIG)"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist"]
      - path: Scripts/upload-sentry-dsym.sh
        name: Upload Sentry dSYM
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
    dependencies:
      - package: QueepCore
      - package: Firebase
        product: FirebaseAuth
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.queep.ios.share
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) QUEEP_SHARE"
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        # PlugInKit looks up the principal class in the appex executable. A debug dylib
        # hides that class, so the share sheet never offers the extension.
        ENABLE_DEBUG_DYLIB: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Salvar no Queep
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.queep.ios.local.share
        CloudDevelopment:
          PRODUCT_BUNDLE_IDENTIFIER: app.queep.ios.dev.share
          QUEEP_FIREBASE_CONFIG: Config/Firebase/Development/Share/GoogleService-Info.plist
        TestFlight:
          PRODUCT_BUNDLE_IDENTIFIER: app.queep.ios.dev.share
          QUEEP_FIREBASE_CONFIG: Config/Firebase/Development/Share/GoogleService-Info.plist
  QueepMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/MacUITests
      - Tests/UITests/MediaFlowTests.swift
      - Tests/UITests/ImageEditTests.swift
      - Tests/Support
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: QueepMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.queep.mac.uitests
        TEST_TARGET_NAME: QueepMac
  QueepCaptureTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/CaptureTests
      - Sources/Shared/IncomingReference.swift
      - Sources/Shared/LibraryStore.swift
      - Sources/Shared/ImportedImage.swift
      - Sources/Shared/ImportedMedia.swift
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - package: QueepCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.queep.capture.tests
  QueepiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
      - Tests/Support
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: QueepiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.queep.ios.uitests
        TEST_TARGET_NAME: QueepiOS
schemes:
  QueepCaptureTests:
    build:
      targets:
        QueepCaptureTests: all
    test:
      targets: [QueepCaptureTests]
  QueepMac:
    build:
      targets:
        QueepMac: all
    test:
      targets: [QueepMacUITests]
  QueepiOS:
    build:
      targets:
        QueepiOS: all
    test:
      targets: [QueepiOSUITests]
  QueepMacCloud:
    build:
      targets:
        QueepMac: all
    run:
      config: CloudDevelopment
    test:
      config: CloudDevelopment
      targets: [QueepMacUITests]
  QueepiOSCloud:
    build:
      targets:
        QueepiOS: all
    run:
      config: CloudDevelopment

  QueepMacTestFlight:
    build:
      targets:
        QueepMac: all
    run:
      config: TestFlight
    archive:
      config: TestFlight
  QueepiOSTestFlight:
    build:
      targets:
        QueepiOS: all
    run:
      config: TestFlight
    archive:
      config: TestFlight
